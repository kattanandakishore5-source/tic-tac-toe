# ─────────────────────────────────────────────
#  Server
# ─────────────────────────────────────────────
server.port=8080
spring.application.name=tictactoe-server

# ─────────────────────────────────────────────
#  PostgreSQL
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/tictactoe
spring.datasource.username=postgres
spring.datasource.password=Nanda@110605
spring.datasource.driver-class-name=org.postgresql.Driver

# ─────────────────────────────────────────────
#  JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
#  WebSocket
# ─────────────────────────────────────────────
app.room.max-rooms=100
app.room.idle-timeout-minutes=30

# ─────────────────────────────────────────────
#  Logging
# ─────────────────────────────────────────────
logging.level.com.tictactoe=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.security=INFO
